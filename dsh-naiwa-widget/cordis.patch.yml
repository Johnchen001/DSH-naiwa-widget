# ============================================================================
# dsh-naiwa-widget —— DSH bundle patch（奶娃余额挂件）
# ============================================================================
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把奶娃挂件插入 Web profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 安装后重启 dsh web，再在浏览器里硬刷新（Ctrl/Cmd + Shift + R）。
# ============================================================================

- insert:
    - id: dsh-naiwa-widget
      name: dsh-naiwa-widget
